# A tag is the release. For Zig the package is its source, fetched by `zig
# fetch` from the tag; for everyone else the release attaches libdateparsa,
# built for six platforms by libraries.yml, with SHA256SUMS and provenance,
# and the Python wheels around it go to PyPI.
# What is published is whatever the tag points at, so this re-runs the gate
# on the tagged commit rather than trusting that it was green on main.
# It refuses a tag that disagrees with .version in build.zig.zon, which is
# what a dependent's build.zig.zon records, and a version CHANGELOG.md has no
# entry for, because that entry is the release notes.
name: release

on:
  push:
    tags:
      - "v*"
  # A dry run on any ref: the gate, the libraries, and the notes it would
  # publish. Nothing is attested or published on a dispatch: `attest` and
  # `publish` are guarded on the event being a tag push rather than on the
  # ref, because a dispatch can name a tag as its ref.
  workflow_dispatch:

# Read at the workflow level, write only on the job that publishes.
permissions:
  contents: read

jobs:
  gate:
    name: the gate, on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: a release is tested from nothing it did not make.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      # On a dispatch there is no tag to compare, so the version checked
      # below is build.zig.zon's own.
      - name: the tag is build.zig.zon's version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ -z "$version" ]; then
            echo "No .version line in build.zig.zon." >&2
            exit 1
          fi
          if [ "$EVENT" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag is $GITHUB_REF_NAME but build.zig.zon says $version." >&2
            echo "Set .version to ${GITHUB_REF_NAME#v} on main and tag that commit." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The lines under "## [<version>]", up to the next heading or the link
      # definitions at the foot of the file.
      - name: CHANGELOG.md has an entry for it
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## / || /^\[.*\]: /) { exit }
            on { print }' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no entry under ## [$VERSION]." >&2
            exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes.md
          retention-days: 7
          if-no-files-found: error
      - name: zig fmt
        run: zig build fmt-check
      # The same pin as ci.yml; bump the two together.
      - name: install zigvet
        env:
          ZIGVET_VERSION: v0.12.0
          ZIGVET_SHA256: de88ffac9ac5081dd75202a632a4ab4038b2f8ff03881dcb266245f5636031f8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zigvet" \
            "https://github.com/kmoneil/zigvet/releases/download/${ZIGVET_VERSION}/zigvet-linux-amd64"
          echo "${ZIGVET_SHA256}  $RUNNER_TEMP/zigvet" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/zigvet"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: zigvet
        run: zig build vet
      # Every mode and both trimmed locale sets ci.yml tests, on Linux. macOS
      # and Windows passed on main before the commit could be tagged.
      - name: tests, in every mode a dependent builds
        run: |
          for mode in Debug ReleaseSafe ReleaseFast ReleaseSmall; do
            zig build test "-Doptimize=$mode" --summary line
          done
          zig build test -Dlocales=en --summary line
          zig build test -Dlocales=fr,de --summary line

  libraries:
    name: libraries
    needs: gate
    uses: ./.github/workflows/libraries.yml

  attest:
    name: attest the libraries
    needs: libraries
    # An attestation is a signed statement in this repository's public store,
    # so writing one is publishing: on a dispatch the job never starts and the
    # OIDC token that would sign is never minted.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      # Each archive and wheel: a signed statement that it was built by this
      # workflow, from this tag, on a runner GitHub hosts. Checked with
      #   gh attestation verify dateparsa-0.3.0-x86_64-linux.tar.gz --repo kmoneil/dateparsa.zig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.whl

  publish:
    name: publish
    # Nothing is published that was not attested first.
    needs: [gate, libraries, attest]
    # Guarded on the job, not a step, so on a dispatch the write token is
    # never minted.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      # A hyphen is what separates a semver prerelease from a release, so
      # v0.2.0-rc.1 is marked a prerelease and not made the latest.
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=(--verify-tag --title "$TAG" --notes-file notes.md)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            dist/*.tar.gz dist/*.zip dist/*.whl dist/SHA256SUMS

  # The wheels to PyPI, last, once the GitHub release is out. PyPI trusts this
  # workflow and the pypi environment as a trusted publisher, so the job holds
  # no token: it mints a short-lived OIDC one, which the action trades for an
  # upload, and with it signs the wheels' PEP 740 attestations. A version
  # PyPI already has is refused, so a tag publishes once. A prerelease tag
  # (v0.3.0-rc.1) is not uploaded: PyPI spells prereleases another way.
  pypi:
    name: publish to PyPI
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dateparsa
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
