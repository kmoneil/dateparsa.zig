# libdateparsa and the dateparsa command as a release ships them, and the
# Python wheels around them. tools/dist.sh builds every platform's archive on
# one Linux runner, and tools/python_wheels.py a wheel from each. Then each
# runner OS unpacks its own platform's archive and links test/c_api.c against
# it, static and shared, with the C compiler it already has (gcc on Linux,
# clang on macOS and Windows), and runs it; runs the command; and installs the
# wheel pip picks for it and runs the Python tests. No Zig on that side: it is
# what someone downloading a release does.
#
# ci.yml calls this on every change, so a tag never finds a platform that does
# not build or link. release.yml calls it on the tagged commit and attaches
# the `libraries` artifact it uploads.
name: libraries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: what is attached to a release is built from nothing it did
      # not make, and this job is what builds it.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          use-cache: false
      - name: tools/dist.sh
        run: tools/dist.sh
      - name: tools/python_wheels.py
        run: python3 -I tools/python_wheels.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libraries
          path: |
            zig-out/dist/*.tar.gz
            zig-out/dist/*.zip
            zig-out/dist/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: zig-out/wheels/*.whl
          retention-days: 7
          if-no-files-found: error

  verify:
    name: verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python the package supports on one runner, a current one
        # on the others. Linux is 24.04, not latest: setup-python builds 3.9
        # (the Python Apple's command line tools ship) for 24.04 and not
        # 26.04, and an older glibc is the stricter test of a manylinux tag.
        include:
          - { os: ubuntu-24.04, platform: x86_64-linux, python: "3.9" }
          - { os: macos-latest, platform: aarch64-macos, python: "3.13" }
          - { os: windows-latest, platform: x86_64-windows, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libraries
          path: dist
      - name: unpack this platform's archive
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c SHA256SUMS; else shasum -a 256 -c SHA256SUMS; fi
          for a in dateparsa-*-"$PLATFORM".*; do
            case "$a" in
              *.zip) unzip -q "$a" ;;
              *) tar -xzf "$a" ;;
            esac
          done
          dir=$(ls -d dateparsa-*-"$PLATFORM")
          # PKG, not LIB: on Windows LIB is the MSVC linker's library path, and
          # clang trusts it over finding Visual Studio itself.
          echo "PKG=$PWD/$dir" >> "$GITHUB_ENV"
          find "$dir" | sort
      - name: static and shared, on Linux and macOS
        if: runner.os != 'Windows'
        run: |
          flags="-std=c11 -Wall -Wextra -Werror -pedantic -I$PKG/include"
          cc $flags test/c_api.c "$PKG/lib/libdateparsa.a" -o c_api_static
          ./c_api_static
          cc $flags test/c_api.c -L"$PKG/lib" -ldateparsa -Wl,-rpath,"$PKG/lib" -o c_api_shared
          ./c_api_shared
      # The DLL through its import library, dateparsa.lib, with the DLL on
      # PATH; then the static library, dateparsa_static.lib.
      - name: static and shared, on Windows
        if: runner.os == 'Windows'
        run: |
          command -v clang >/dev/null || export PATH="/c/Program Files/LLVM/bin:$PATH"
          flags="-std=c11 -Wall -Wextra -Werror -pedantic -I$PKG/include"
          clang $flags test/c_api.c "$PKG/lib/dateparsa.lib" -o c_api_shared.exe
          PATH="$PKG/bin:$PATH" ./c_api_shared.exe
          clang $flags test/c_api.c "$PKG/lib/dateparsa_static.lib" -o c_api_static.exe
          ./c_api_static.exe
      # The dateparsa command beside the libraries, run as it ships: a file
      # read twice, and standard input held for the second pass.
      - name: the dateparsa command
        run: |
          exe="$PKG/bin/dateparsa"
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          "$exe" --version
          "$exe" detect testdata/cli/orders.csv --col date
          printf '01/02/2024\n13/02/2024\n' | "$exe" normalize > got.txt
          printf '2024-02-01T00:00:00Z\n2024-02-13T00:00:00Z\n' > want.txt
          diff want.txt got.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # pip picks the wheel, so a wrong platform tag fails here. The tests run
      # from outside the checkout's python/src, against what pip installed.
      - name: the Python wheel
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python"
          "$py" -m pip install --no-index --find-links wheels dateparsa
          tests="$PWD/python/tests"
          cd "$RUNNER_TEMP"
          "$py" -c "import dateparsa, sys; print(dateparsa.__version__, dateparsa.__file__, sys.version)"
          "$py" -m unittest discover -v -s "$tests"
          # ParsedColumn.datetime64 needs numpy, which the package does not
          # depend on: with it installed, its test may not skip.
          "$py" -m pip install --only-binary :all: numpy
          DATEPARSA_TEST_NUMPY=1 "$py" -m unittest discover -v -s "$tests" -k datetime64
