# Coverage-guided fuzzing of the targets in src/fuzz_test.zig, kept off the
# pull-request path on purpose.
#
# The regression half already runs on every pull request: `zig build test`
# in ci.yml replays every target's seeds, deterministically. What is left is
# discovery, and discovery scales with cumulative CPU time against a corpus
# that persists, not with the length of any one run. So this runs briefly
# after each merge to main, against the code that just changed, and for half
# an hour every night, each run starting from the corpus the last one kept.
# A longer campaign belongs on a spot VM, not on a runner.
#
# A find opens an issue, or comments on the one already open, and keeps the
# input. It blocks nothing: a find is usually about code the last pull
# request never touched, and a red on somebody's unrelated merge teaches
# people to press re-run.
name: fuzz

on:
  push:
    branches: [main]
  schedule:
    # 06:41 UTC. Off the hour, because every cron in the world runs on it,
    # and a queued runner is a shorter fuzz run.
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes until fuzzing must stop, at most 150 (no round starts that might end later than 4 minutes before)
        required: false
        default: "30"
      limit:
        description: Runs per fuzz target at most, as zig build --fuzz takes it (20K, 2M); the minutes usually stop it first
        required: false
        default: 1G

permissions:
  contents: read

# One run at a time, so two never race to save the corpus. A run that finds
# one in progress waits for it rather than cancelling it.
concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # Fuzzing is held to a time, not a count: tools/fuzz.sh runs rounds
    # until its deadline nears, so a new target makes a night's rounds
    # fewer, not the job longer. Until 2026-11-06 a night was 10M runs a
    # target. Two runs on 2026-10-28 priced the runner at about 13K runs a
    # second over all the targets together, after about 160 s building with
    # LLVM, so the night grew with the targets, from about 90 minutes with
    # seven to past the 180-minute timeout with thirteen; four nights in a
    # row were cancelled, and a cancelled run reported nothing. The timeout
    # is a backstop above the deadline, with room to restore and save the
    # corpus.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 180 || 50 }}
    # actions: read finds and downloads the corpus an earlier run kept.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      # The corpus is kept as an artifact rather than in the cache, which
      # evicts the least recently used entry first: the corpus, read once a
      # night. setup-zig points the Zig cache at
      # .zig-cache in the workspace, and the fuzzer keeps one directory per
      # target under .zig-cache/f, named by a hash of the test's name, so a
      # corpus outlives code changes. The newest from this branch or main is
      # the one restored.
      #
      # Each gh call is retried (tools/retry.sh). One that still fails fails
      # the run rather than fuzzing from the seeds alone: that run's corpus
      # would be the newest, and the next run would restore it in place of
      # the one every earlier night built.
      - name: Restore the fuzz corpus
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -o pipefail
          . tools/retry.sh
          newest() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=fuzz-corpus&per_page=100" --jq '
              [.artifacts[] | select(.expired | not)
                | select(.workflow_run.head_branch == env.BRANCH or .workflow_run.head_branch == "main")]
              | sort_by(.created_at) | last | .id // empty'
          }
          download() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/corpus.zip"
          }
          id=$(retry newest)
          if [ -z "$id" ]; then
            echo "No fuzz-corpus artifact yet: this run starts from the seeds alone"
            exit 0
          fi
          retry download
          mkdir -p .zig-cache/f
          unzip -q -o "$RUNNER_TEMP/corpus.zip" -d .zig-cache/f
          echo "Restored artifact $id: $(find .zig-cache/f -type f | wc -l) files"

      # tools/fuzz.sh fails the step on a find, which `zig build --fuzz` alone
      # does not always do, and prints the failing input in hex. After a
      # merge, one round of 50K a target, about 4 minutes. A night, rounds
      # of 100K a target (about 100 s each with thirteen targets) until 30
      # minutes are up: about 25 minutes of fuzzing, since no round starts
      # that might end later than 4 minutes before the deadline. A round
      # still running then is cut and fails the step: a hang the fuzzer
      # found, or something as wrong.
      - name: Coverage-guided fuzzing
        env:
          LIMIT: ${{ github.event_name == 'push' && '50K' || inputs.limit || '1G' }}
          ROUND: ${{ github.event_name == 'push' && '50K' || '100K' }}
          MINUTES: ${{ github.event_name == 'push' && '15' || inputs.minutes || '30' }}
        run: |
          set -o pipefail
          case "$MINUTES" in
            '' | *[!0-9]*) echo "::error::minutes is a whole number, not '$MINUTES'"; exit 2 ;;
          esac
          if [ "$MINUTES" -gt 150 ]; then
            echo "::error::minutes is at most 150, to end within the job's 180-minute timeout"
            exit 2
          fi
          export FUZZ_DEADLINE=$(($(date +%s) + MINUTES * 60))
          tools/fuzz.sh "$LIMIT" "$ROUND" 2>&1 | tee fuzz.log

      # 30 days, so a corpus outlasts a few nights without a run. Only the
      # targets' directories: in<N> is the fuzzer's input buffer and crash
      # the failing input, kept by the step below.
      - name: Save the fuzz corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: |
            .zig-cache/f
            !.zig-cache/f/in*
            !.zig-cache/f/crash
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      # crash is the failing input, whole, as the runner saved it (Zig
      # 0.17.1; 0.17.0 left it empty); the log has it in hex, from
      # tools/fuzz.sh. The input buffers, in<N> (a 20-byte header whose last
      # u32 is the length, then the input), hold what each target was last
      # running: in a cut round, what it may have been stuck on.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure
          path: |
            fuzz.log
            .zig-cache/f/crash
            .zig-cache/f/in*
          include-hidden-files: true
          if-no-files-found: ignore

  # Also when the fuzz job was cancelled, which is what a job past its
  # timeout reads as: four nights to 2026-11-04 timed out, and with
  # failure() alone nothing said so.
  report:
    name: report a find
    needs: fuzz
    if: always() && needs.fuzz.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # For tools/retry.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
      # One open issue at a time: a target that keeps failing comments on it
      # every run rather than opening one a night.
      #
      # On 2026-11-05 a real find opened nothing, because `gh issue list` met
      # one GraphQL error. So the report is retried whole: each try lists
      # again, and a create that went through but answered with an error is
      # then found and commented on rather than opened twice. If every try
      # fails, this job says so, and the fuzz job's summary has the find.
      - name: open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RESULT: ${{ needs.fuzz.result }}
        run: |
          . tools/retry.sh
          if [ "$RESULT" = failure ]; then
            what="failed"
            title="fuzz: a fuzz target found a failing input"
          else
            what="did not finish ($RESULT: cancelled, or past the job's timeout)"
            title="fuzz: a fuzz run did not finish"
          fi
          report() {
            local open
            open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label fuzz --state open \
              --json number --jq '.[0].number // empty') || return
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
                --body "Fuzzing ($EVENT) $what again on $SHA: $RUN"
              return
            fi
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label fuzz \
              --body "$(printf '%s\n' \
                "Fuzzing ($EVENT) $what on $SHA." \
                "" \
                "Run: $RUN" \
                "" \
                "The fuzz step's log prints the failing input in hex: each string the" \
                "target's Smith read is a four-byte little-endian length and its bytes," \
                "each value eight bytes. The run's fuzz-failure artifact keeps the log" \
                "and the input itself, .zig-cache/f/crash." \
                "" \
                "Add the input to that target's seeds in src/fuzz_test.zig first, its" \
                "bytes as they stand, so \`zig build test\` reproduces it, then fix" \
                "what it found." \
                "" \
                "If the job ran out of time or failed before fuzzing, there is no input:" \
                "the log says which.")"
          }
          if ! retry report; then
            echo "::error::Fuzzing $what, and gh failed on every try to report it, so no issue was opened or commented on. The fuzz job's summary has what it found."
            {
              echo "## The find was not reported"
              echo
              echo "Fuzzing ($EVENT) $what on $SHA, and gh failed on every try to open an issue for it or comment on the open one."
              echo "The fuzz job's summary has what it found, if it found an input."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
